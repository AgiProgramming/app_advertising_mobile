name: Rilis APK

# Continuous Delivery: setiap tag versi (mis. v1.0.0) otomatis membuat
# GitHub Release berisi APK yang siap dibagikan ke bengkel.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  rilis:
    name: Build & terbitkan rilis
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Pasang dependensi
        run: flutter pub get

      - name: Build APK rilis
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Siapkan berkas rilis
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/mann-plus-payroll-${GITHUB_REF_NAME}.apk"

      - name: Terbitkan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mann Plus Payroll ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk

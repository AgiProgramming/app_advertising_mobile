name: Mobile CI

# Pipeline integrasi berkelanjutan untuk aplikasi Flutter Mann Plus Payroll.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  # ---------------------------------------------------------------------------
  # Tahap 1: analisis statis + pengujian widget/unit
  # ---------------------------------------------------------------------------
  analisis-dan-tes:
    name: Analisis & pengujian
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Info versi
        run: flutter --version

      - name: Pasang dependensi
        run: flutter pub get

      - name: Analisis statis
        run: flutter analyze --no-pub

      - name: Jalankan pengujian
        run: flutter test --reporter expanded --no-pub

  # ---------------------------------------------------------------------------
  # Tahap 2: build APK rilis (artefak siap pasang)
  # ---------------------------------------------------------------------------
  build-apk:
    name: Build APK rilis
    runs-on: ubuntu-latest
    needs: analisis-dan-tes
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pasang dependensi
        run: flutter pub get

      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Ganti nama berkas
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/mann-plus-payroll-${GITHUB_SHA::7}.apk"

      - name: Simpan artefak APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-rilis
          path: dist/*.apk
          retention-days: 30

      - name: Ringkasan hasil
        if: always()
        run: |
          {
            echo "### Hasil build aplikasi mobile"
            echo ""
            echo "- Flutter: **$FLUTTER_VERSION**"
            echo "- Analisis statis: \`flutter analyze\`"
            echo "- Pengujian: \`flutter test\`"
            echo "- Artefak: APK rilis (arm64), tersimpan 30 hari"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
